{% extends 'base.html' %}
{% block page_title %}Relatórios{% endblock %}
{% block content %}
<div class="mb-6">
    <div class="text-sm uppercase tracking-[.25em] text-emerald-300/70">Indicadores</div>
    <h1 class="mt-1 text-3xl font-bold">Relatórios e Gráficos</h1>
    <p class="mt-2 text-sm text-slate-400">Visão executiva dos módulos principais.</p>
</div>
<div class="grid gap-5 md:grid-cols-2 xl:grid-cols-4">
    {% for label, value in counts.items %}
    <div class="rounded-[1.5rem] border border-emerald-900/40 bg-[#0f1f18]/80 p-6 shadow-glow">
        <div class="text-sm text-slate-400">{{ label }}</div>
        <div class="mt-3 text-4xl font-bold">{{ value }}</div>
    </div>
    {% endfor %}
    <div class="rounded-[1.5rem] border border-emerald-900/40 bg-[#0f1f18]/80 p-6 shadow-glow">
        <div class="text-sm text-slate-400">Receita total</div>
        <div class="mt-3 text-4xl font-bold text-emerald-300">R$ {{ revenue }}</div>
    </div>
</div>
<div class="mt-6 rounded-[1.5rem] border border-emerald-900/40 bg-[#0f1f18]/80 p-6 shadow-glow">
    <canvas id="reportChart" height="110"></canvas>
</div>
<script>
window.addEventListener('load', function () {
  const ctx = document.getElementById('reportChart');
  if (!ctx || !window.Chart) return;
  new Chart(ctx, {
    type: 'bar',
    data: {
      labels: [{% for label, value in counts.items %}'{{ label }}',{% endfor %}],
      datasets: [{ label: 'Total', data: [{% for label, value in counts.items %}{{ value }},{% endfor %}] }]
    },
    options: { plugins: { legend: { labels: { color: '#cbd5e1' } } }, scales: { x: { ticks: { color: '#94a3b8' } }, y: { ticks: { color: '#94a3b8' } } } }
  });
});
</script>
{% endblock %}
