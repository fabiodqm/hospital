{% extends 'base.html' %}
{% block page_title %}{{ title }}{% endblock %}
{% block content %}
<div class="mx-auto max-w-4xl">
    <div class="mb-6 flex items-center justify-between">
        <div>
            <div class="text-sm uppercase tracking-[.25em] text-emerald-300/70">Administração</div>
            <h1 class="mt-1 text-3xl font-bold">{{ title }}</h1>
        </div>
        <a href="{% url 'admin_panel' %}" class="btn-soft">Voltar</a>
    </div>
    <form method="post" enctype="multipart/form-data" class="rounded-[1.5rem] border border-emerald-900/40 bg-[#0f1f18]/80 p-6 shadow-glow">
        {% csrf_token %}
        <div class="grid gap-5 md:grid-cols-2">
            {% for field in form %}
            <div class="{% if field.name == 'specialties' %}md:col-span-2{% endif %}">
                <label class="mb-2 block text-sm font-medium text-slate-300">{{ field.label }}</label>
                {{ field }}
                {% for error in field.errors %}<p class="mt-1 text-xs text-red-300">{{ error }}</p>{% endfor %}
            </div>
            {% endfor %}
        </div>
        <div class="mt-8 flex justify-end gap-3">
            <a href="{% url 'admin_panel' %}" class="rounded-2xl border border-slate-700 px-5 py-3 text-sm font-semibold text-slate-200 hover:bg-slate-800">Cancelar</a>
            <button class="rounded-2xl bg-emerald-500 px-6 py-3 text-sm font-bold text-slate-950 hover:bg-emerald-400">Salvar</button>
        </div>
    </form>
</div>
{% endblock %}
